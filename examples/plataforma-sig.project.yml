# examples/plataforma-sig.project.yml
#
# Configuración de arranque para el repo `plataforma-sig`. Cópiala a
# `plataforma-sig/.agents/project.yml`.
#
# Diferencias deliberadas contra AI Core:
#   · documentación en español — el equipo y el cliente leen en español
#   · sin glosario ni ERD todavía → en `null`, y las skills se saltan esos pasos
#   · sin grafo mermaid ni totales en el índice al principio → menos ceremonia
#     mientras el backlog es chico; se encienden cuando estorbe no tenerlos
#   · PR obligatorio — son 2 personas y nadie se autoaprueba
#   · bitácora activa desde el día 1
#
# Lo marcado 🔧 es propuesta mía y hay que confirmarlo antes de la primera historia.

version: 1

project:
  name: Plataforma SIG
  repo: TobalFacio/plataforma-sig
  default_branch: main
  private: true
  language:
    docs: es
    ui: es

paths:
  backlog: docs/backlog
  index: docs/backlog/README.md
  context: docs/context.md
  template: docs/templates/plantilla-historia.md
  glossary: null # 🔧 aún no existe; crear cuando aparezca el primer término discutido
  decision_record: docs/context.md · Decisiones cerradas
  erd: null # 🔧 se llena cuando el agente db-schema publique el modelo
  sql: null
  mockups: docs/mockups # ahí vive SIG_Arquitectura_Documentacion_Mockup.html
  diagrams: null
  bitacora: docs/bitacora
  conventions: CLAUDE.md

story:
  id_prefix: HU
  slug_language: es
  actor_markers:
    - "**Como** "
  sections:
    - "## 1. Objetivo"
    - "## 2. Descripción"
    - "## 3. Diseño de interfaz"
    - "## 4. Conversación"
    - "### 4.1 Flujo funcional"
    - "## 5. Criterios de aceptación"
    - "### 5.1 Funcionales"
    - "### 5.2 No funcionales"
    - "### 5.3 Eventos"
    - "### 5.4 Métricas"
    - "## 6. Recursos técnicos"
    - "### 6.1 Endpoints"
    - "### 6.2 Datos"
  data_section: "### 6.2 Datos"
  gap_marker: "⚠️ FALTA"
  inferred_marker: "⚠️ inferido"
  estimate_pattern: "^\\d+$"
  frontmatter:
    required:
      - id
      - title
      - epic
      - module
      - phase
      - stage
      - milestone
      - priority
      - status
      - estimate_days
      - depends_on
      - blocks
    optional:
      - mockup
      - notion
    forbidden:
      - prepared_by
      - reviewed_by
      - approved_by

enums:
  status: [Backlog, Diseñada, Lista para dev, En curso, Hecha]
  # 🔧 Las cuatro semanas de desarrollo del Plan V081826, más la Semana 0.
  phase: [F0, F1, F2, F3, F4]
  stage: ["MVP (F0–F4)", "Post-MVP"]
  priority: [P0, P1, P2]
  # 🔧 Módulos derivados del mockup congelado v1.
  module:
    - Arquitectura
    - Expediente
    - Agentes
    - Exportación
    - Identidad
    - Transversal
  epic_pattern: "^E\\d{2}$"
  milestone: [H1, H2, H3, H4, "—"]

index:
  row_pattern: '\| \[(?<id>HU-\d+)\]\((?<file>HU-[^)]+)\) \| [^|]+\| (?<epic>E\d+) \| [^|]+\| (?<priority>P\d) \| (?<status>[^|]+)\| (?<days>\d+) \|'
  mermaid: false
  totals: false
  total_label: Total
  subtotal: null

tracker:
  kind: github
  # 🔧 Alineadas al calendario del plan: Semana 0 + cuatro semanas de desarrollo.
  milestones:
    F0: F0 Prerrequisitos
    F1: F1 Arquitectura navegable
    F2: F2 Expediente documental
    F3: F3 Agentes
    F4: F4 Exportación y piloto
  labels:
    type: [type:task, type:spike, type:refactor, type:chore]
    layer: [layer:db, layer:backend, layer:frontend, layer:infra, layer:tests]
    priority: [priority:P0, priority:P1, priority:P2]
    extra: [blocked, ready-for-dev]
  gh_min_version: "2.94"
  branch_pattern: feature/HU-NN-slug
  pull_request: required

board:
  enabled: true
  kind: notion
  data_source: null # 🔧 pegar el collection:// de la base de SIG cuando exista
  source_of_truth: repo

verify:
  # scripts/shared es el junction al repo de skills — ver Link-AgentSkills.ps1
  command: node scripts/shared/verify-backlog.mjs
  checks:
    references: true
    symmetry: true
    phase_order: true
    index_rows: true
    index_totals: false # se enciende cuando el índice lleve fila de totales
    mermaid: false # se enciende cuando el backlog pase de ~15 historias
    sections: true
    single_actor: true
    enums: true
    frontmatter: true
    unknown_keys: true # repo nuevo: aquí sí conviene ser estricto desde el día 1
    data_section: true
    diagrams: false
